[ABOUT]
NAME = P2P 1v1
AUTHOR = x4fab
VERSION = 0.4
DESCRIPTION = Drive with a friend via a peer-to-peer connection.

[CORE]
SESSION_AWARE=1 ; Do not restart script with game restarts, we can handle it on our own

[RULES]
BASE_MODE=PRACTICE
AI_LIMIT=0
AI_LEVEL=100
START_TYPE=PIT
ALLOW_PHYSICS_ALTERATIONS=1
ALLOWED_TRACKS=pits>1

[DISPLAY]
OPPONENT_NOUN=AI

[MIXIN: Tweaks_FrozenDrive]
@ACTIVE = $" read('settings.ini/SETTINGS/FROZEN_DRIVE', false) or read('race.ini/RACE/__CM_CUSTOM_MODE:1', ''):find('%.i$') ~= nil "
FORCE_EXTENDED_PHYSICS=1
ICE_EVERYWHERE=1
SEASON_FORCE=WINTER

[TWEAKS]
VERIFY_STEAM_API=1 ; we need to make sure Steam API is ready and running
ALT_ONLINE_CARS=1 ; number of “remote” cars that can be used in “altonline” API
ALT_ONLINE_CAR_ID=nul ; if not set, `nul` will be used
ALT_ONLINE_CHAT=1 ; show chat
DYNAMIC_TRACK_OBJECTS_SEED=$"{ read('race.ini/RACE/TRACK'), read('race.ini/RACE/CONFIG_TRACK') }"
PARAM_TEST=$" read('race.ini/RACE/__CM_CUSTOM_MODE:0', '') "
@ = Tweaks_FrozenDrive
