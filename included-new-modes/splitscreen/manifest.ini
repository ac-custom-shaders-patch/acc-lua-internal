[ABOUT]
NAME = Splitscreen
AUTHOR = x4fab
VERSION = 1.0
DESCRIPTION = Might fit for pair drifting or something idk.

[RULES]
BASE_MODE=RACE
PENALTIES=1
AI_LIMIT=1
AI_LEVEL=100
ALLOW_PHYSICS_ALTERATIONS=1 ; allows teleports and physics API to Lua apps, for modes without competitive aspect

[MIXIN: Tweaks_FrozenDrive]
@ACTIVE = $" read('settings.ini/SETTINGS/FROZEN_DRIVE', false) "
FORCE_EXTENDED_PHYSICS=1
ICE_EVERYWHERE=1
SEASON_FORCE=WINTER

[TWEAKS]
IMMEDIATE_START=1
RENDER_MODE=__EXT_SPLITSCREEN
@ = Tweaks_FrozenDrive
