[SETTINGS]
; Settings
HORIZONTAL_LAYOUT=1 ; horizontal layout (first player image is above); 1 or 0
ALT_CONTROLS_CONFIG= ; controls preset for second car; local file (INI Files|*.ini), relative to "%Documents%\Assetto Corsa\cfg\controllers"
TWO_RAW_MICE=1 ; Two mice (if both control presets use keyboard input method, switch to processing raw input to distinguish between several connected mouse devices); 1 or 0
HIDE_HUD=1 ; Leave HUD empty (please keep in mind, all of AC and third-party apps aren’t ready for splitscreen mode and would only show info about the first car); 1 or 0
INCLUDE_TRAFFIC=0 ; Include traffic when available (traffic is only available on configured tracks); 1 or 0
FROZEN_DRIVE=0 ; Frozen track; 1 or 0